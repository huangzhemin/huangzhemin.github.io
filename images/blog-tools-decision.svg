<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">个人博客工具选择决策树</title>
  <desc id="desc">根据 Git、后台、交互和文章规模选择博客工具</desc>
  <rect width="1200" height="720" fill="#fbfcfe"/>
  <text x="70" y="68" fill="#172033" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">从需求到工具：四步选型</text>
  <text x="70" y="102" fill="#657084" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">先决定工作流，再决定框架</text>
  <g stroke="#9aa6b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 180 V230 H300 V280"/><path d="M600 230 H900 V280"/>
    <path d="M300 370 V420 H180 V470"/><path d="M300 420 H450 V470"/>
    <path d="M900 370 V420 H760 V470"/><path d="M900 420 H1040 V470"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <rect x="430" y="120" width="340" height="70" rx="14" fill="#172033"/>
    <text x="600" y="164" fill="#ffffff" font-size="22" font-weight="700">愿意用 Git 管理文章？</text>
    <rect x="140" y="280" width="320" height="90" rx="14" fill="#e8f1ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="300" y="318" fill="#1d4ed8" font-size="21" font-weight="700">是</text>
    <text x="300" y="348" fill="#526176" font-size="16">还需要组件化交互吗？</text>
    <rect x="740" y="280" width="320" height="90" rx="14" fill="#eaf8ef" stroke="#35a56b" stroke-width="3"/>
    <text x="900" y="318" fill="#207544" font-size="21" font-weight="700">否</text>
    <text x="900" y="348" fill="#526176" font-size="16">需要后台和插件吗？</text>
    <rect x="40" y="470" width="280" height="104" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="180" y="510" fill="#1d4ed8" font-size="22" font-weight="700">Astro</text>
    <text x="180" y="542" fill="#526176" font-size="15">组件化内容站</text>
    <rect x="310" y="470" width="280" height="104" rx="14" fill="#e0efff" stroke="#4f83cc" stroke-width="3"/>
    <text x="450" y="510" fill="#285b9e" font-size="22" font-weight="700">Hugo / Hexo</text>
    <text x="450" y="542" fill="#526176" font-size="15">技术博客与笔记</text>
    <rect x="620" y="470" width="280" height="104" rx="14" fill="#fff2df" stroke="#e79a2f" stroke-width="3"/>
    <text x="760" y="510" fill="#a55d00" font-size="22" font-weight="700">WordPress / Ghost</text>
    <text x="760" y="542" fill="#725b43" font-size="15">后台、会员、订阅</text>
    <rect x="930" y="470" width="230" height="104" rx="14" fill="#f4eaff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="1045" y="510" fill="#6d3fc2" font-size="22" font-weight="700">Notion / 语雀</text>
    <text x="1045" y="542" fill="#67527f" font-size="15">不想维护部署</text>
  </g>
  <text x="600" y="650" fill="#657084" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" text-anchor="middle">没有绝对最好的工具，只有与你的发布习惯匹配的工具</text>
</svg>
