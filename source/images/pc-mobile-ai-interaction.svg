<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">三代技术浪潮的交互方式变化</title><desc id="desc">从操作软件到触摸应用，再到描述目标让 AI 执行</desc>
<rect width="1200" height="480" fill="#f7f9fc"/><text x="60" y="68" font-family="sans-serif" font-size="31" font-weight="700" fill="#182235">交互方式的三次变化</text>
<text x="60" y="103" font-family="sans-serif" font-size="17" fill="#667085">用户表达意图的成本逐步下降，系统承担的规划越来越多</text>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(90 155)"><rect width="300" height="220" rx="18" fill="#e8f0ff" stroke="#2563eb" stroke-width="2"/><text x="150" y="52" font-size="25" font-weight="700" fill="#1d4ed8">PC</text><text x="150" y="103" font-size="18" fill="#344054">打开应用</text><text x="150" y="140" font-size="18" fill="#344054">点击菜单</text><text x="150" y="177" font-size="18" fill="#344054">逐步完成任务</text></g><g transform="translate(450 155)"><rect width="300" height="220" rx="18" fill="#e7f8f0" stroke="#10b981" stroke-width="2"/><text x="150" y="52" font-size="25" font-weight="700" fill="#087443">移动互联网</text><text x="150" y="103" font-size="18" fill="#344054">触摸与滑动</text><text x="150" y="140" font-size="18" fill="#344054">通知与推荐</text><text x="150" y="177" font-size="18" fill="#344054">随时随地完成任务</text></g><g transform="translate(810 155)"><rect width="300" height="220" rx="18" fill="#f1eaff" stroke="#8b5cf6" stroke-width="2"/><text x="150" y="52" font-size="25" font-weight="700" fill="#6d3fc2">AI</text><text x="150" y="103" font-size="18" fill="#344054">描述目标</text><text x="150" y="140" font-size="18" fill="#344054">系统规划与调用工具</text><text x="150" y="177" font-size="18" fill="#344054">协作完成任务</text></g></g>
</svg>
