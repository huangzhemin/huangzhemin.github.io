<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">三代技术时代的硬件与软件栈</title><desc id="desc">PC、本地终端与云端、AI 加速器和端云协同的硬件演进</desc>
<rect width="1200" height="560" fill="#fbfcfe"/><text x="60" y="70" font-family="sans-serif" font-size="31" font-weight="700" fill="#182235">硬件如何托起每一代软件</text>
<text x="60" y="105" font-family="sans-serif" font-size="17" fill="#667085">从单机设备，到端云协同，再到云端算力与端侧 NPU 的组合</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="70" y="155" width="310" height="300" rx="18" fill="#e8f0ff" stroke="#2563eb" stroke-width="2"/><text x="225" y="202" font-size="25" font-weight="700" fill="#1d4ed8">PC 时代</text><rect x="125" y="235" width="200" height="52" rx="10" fill="#fff"/><text x="225" y="268" font-size="17" fill="#344054">CPU + 内存 + 硬盘</text><rect x="125" y="305" width="200" height="52" rx="10" fill="#fff"/><text x="225" y="338" font-size="17" fill="#344054">操作系统 + 桌面软件</text><text x="225" y="405" font-size="16" fill="#475467">本地安装、本地文件</text>
<rect x="445" y="155" width="310" height="300" rx="18" fill="#e7f8f0" stroke="#10b981" stroke-width="2"/><text x="600" y="202" font-size="25" font-weight="700" fill="#087443">移动互联网</text><rect x="500" y="235" width="200" height="52" rx="10" fill="#fff"/><text x="600" y="268" font-size="17" fill="#344054">ARM + 摄像头 + 传感器</text><rect x="500" y="305" width="200" height="52" rx="10" fill="#fff"/><text x="600" y="338" font-size="17" fill="#344054">App + 云服务 + CDN</text><text x="600" y="405" font-size="16" fill="#475467">随身连接、持续同步</text>
<rect x="820" y="155" width="310" height="300" rx="18" fill="#f1eaff" stroke="#8b5cf6" stroke-width="2"/><text x="975" y="202" font-size="25" font-weight="700" fill="#6d3fc2">AI 时代</text><rect x="875" y="235" width="200" height="52" rx="10" fill="#fff"/><text x="975" y="268" font-size="17" fill="#344054">GPU / NPU + HBM</text><rect x="875" y="305" width="200" height="52" rx="10" fill="#fff"/><text x="975" y="338" font-size="17" fill="#344054">模型 + 工具 + Agent</text><text x="975" y="405" font-size="16" fill="#475467">云端能力、端侧智能</text></g>
</svg>
