<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">PC、移动互联网与 AI 时代时间线</title><desc id="desc">三次技术浪潮从本地计算、随身连接到智能协作的演进</desc>
<rect width="1200" height="520" fill="#f7f9fc"/><text x="60" y="72" font-family="sans-serif" font-size="32" font-weight="700" fill="#182235">三次技术浪潮：计算离我们越来越近</text>
<text x="60" y="108" font-family="sans-serif" font-size="17" fill="#667085">从桌面上的机器，到口袋里的网络，再到会理解目标的智能系统</text>
<line x1="110" y1="286" x2="1090" y2="286" stroke="#b3bdcc" stroke-width="6"/>
<g font-family="sans-serif"><circle cx="270" cy="286" r="22" fill="#2563eb"/><circle cx="600" cy="286" r="22" fill="#10b981"/><circle cx="930" cy="286" r="22" fill="#8b5cf6"/>
<g transform="translate(100 150)"><rect width="340" height="100" rx="16" fill="#e8f0ff" stroke="#2563eb" stroke-width="2"/><text x="24" y="40" font-size="25" font-weight="700" fill="#1d4ed8">PC 时代</text><text x="24" y="73" font-size="17" fill="#475467">1980s–2000s · 本地计算</text></g>
<g transform="translate(430 320)"><rect width="340" height="100" rx="16" fill="#e7f8f0" stroke="#10b981" stroke-width="2"/><text x="24" y="40" font-size="25" font-weight="700" fill="#087443">移动互联网</text><text x="24" y="73" font-size="17" fill="#475467">2007–2022 · 随身连接</text></g>
<g transform="translate(760 150)"><rect width="340" height="100" rx="16" fill="#f1eaff" stroke="#8b5cf6" stroke-width="2"/><text x="24" y="40" font-size="25" font-weight="700" fill="#6d3fc2">AI 时代</text><text x="24" y="73" font-size="17" fill="#475467">2022–未来 · 目标驱动</text></g>
<text x="270" y="330" text-anchor="middle" font-size="17" fill="#344054">键盘、鼠标、窗口</text><text x="600" y="260" text-anchor="middle" font-size="17" fill="#344054">触摸、传感器、云</text><text x="930" y="330" text-anchor="middle" font-size="17" fill="#344054">自然语言、Agent、多模态</text></g>
</svg>
