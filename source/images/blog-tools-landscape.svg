<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">个人博客工具四类方案地图</title>
  <desc id="desc">静态生成器、动态 CMS、托管写作平台和低代码构建器的定位对比</desc>
  <rect width="1200" height="680" fill="#f7f8fa"/>
  <rect x="48" y="40" width="1104" height="600" rx="18" fill="#ffffff" stroke="#d9dee7" stroke-width="2"/>
  <text x="88" y="92" fill="#172033" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">个人博客工具四类方案</text>
  <text x="88" y="126" fill="#657084" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">越靠右越省运维，越靠上越自由可控</text>
  <line x1="142" y1="520" x2="1060" y2="520" stroke="#8a95a8" stroke-width="2"/>
  <line x1="142" y1="520" x2="142" y2="176" stroke="#8a95a8" stroke-width="2"/>
  <text x="934" y="558" fill="#657084" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">省运维 →</text>
  <text x="74" y="190" fill="#657084" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" transform="rotate(-90 74 190)">自由可控 →</text>
  <g>
    <rect x="210" y="220" width="330" height="188" rx="14" fill="#e8f1ff" stroke="#3b82f6" stroke-width="3"/>
    <text x="242" y="262" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700">静态生成器</text>
    <text x="242" y="300" fill="#26364d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Hexo · Hugo · Astro · Jekyll</text>
    <text x="242" y="340" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Markdown / Git / CI</text>
    <text x="242" y="372" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">快、便宜、可迁移</text>
  </g>
  <g>
    <rect x="590" y="198" width="300" height="170" rx="14" fill="#fff2df" stroke="#e79a2f" stroke-width="3"/>
    <text x="622" y="240" fill="#a55d00" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="25" font-weight="700">动态 CMS</text>
    <text x="622" y="278" fill="#4e3d2b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">WordPress · Ghost · Halo</text>
    <text x="622" y="318" fill="#725b43" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">后台、插件、会员、协作</text>
    <text x="622" y="350" fill="#725b43" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">能力完整，运维较重</text>
  </g>
  <g>
    <rect x="270" y="440" width="290" height="112" rx="14" fill="#eaf8ef" stroke="#35a56b" stroke-width="3"/>
    <text x="302" y="478" fill="#207544" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">托管写作平台</text>
    <text x="302" y="514" fill="#4c6d59" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Notion · 语雀 · Substack</text>
    <text x="302" y="540" fill="#4c6d59" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">开箱即用，平台依赖</text>
  </g>
  <g>
    <rect x="760" y="432" width="294" height="120" rx="14" fill="#f4eaff" stroke="#8b5cf6" stroke-width="3"/>
    <text x="792" y="470" fill="#6d3fc2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="23" font-weight="700">低代码构建器</text>
    <text x="792" y="506" fill="#67527f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Webflow · Framer · Wix</text>
    <text x="792" y="534" fill="#67527f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">视觉优先，长文管理较弱</text>
  </g>
  <circle cx="1030" cy="170" r="11" fill="#3b82f6"/>
  <text x="1050" y="176" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">自由度</text>
  <circle cx="1030" cy="204" r="11" fill="#35a56b"/>
  <text x="1050" y="210" fill="#526176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">省心</text>
</svg>
